name: Nagram Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish.
        required: true
        type: string
      only:
        description: Platform to build, for trial runs.
        type: choice
        default: all
        options: [all, macos, windows, linux]
      windows_arch:
        description: Windows architecture to build, for trial runs.
        type: choice
        default: all
        options: [all, x64, arm64]

jobs:

  macos:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'macos' }}
    uses: ./.github/workflows/nagram-mac.yml
    permissions:
      contents: read
      actions: write
    with:
      config: Release
      ref: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

  windows:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'windows' }}
    uses: ./.github/workflows/nagram-win.yml
    permissions:
      contents: read
      actions: write
    with:
      config: Release
      ref: ${{ inputs.tag || github.ref_name }}
      archs: ${{ inputs.windows_arch == 'x64' && '["x64"]' || inputs.windows_arch == 'arm64' && '["arm64"]' || '["x64","arm64"]' }}
    secrets: inherit

  linux:
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'linux' }}
    uses: ./.github/workflows/nagram-linux.yml
    permissions:
      contents: read
      actions: write
    with:
      config: Release
      ref: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

  publish:
    name: Publish
    needs: [macos, windows, linux]
    # A platform that fails must not block the packages that were built.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: docs/nagram/releases

      - name: Download packages.
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          path: packages
          merge-multiple: true

      - name: Publish.
        run: |
          VERSION="${TAG#v}"
          mkdir upload
          for file in packages/*; do
            name="$(basename "$file")"
            mv "$file" "upload/${name/Nagram-/Nagram-$VERSION-}"
          done
          ls -l upload
          test -n "$(ls upload)"

          NOTES="docs/nagram/releases/$TAG.md"
          test -f "$NOTES"

          PRERELEASE=""
          case "$TAG" in (*-*) PRERELEASE="--prerelease";; esac

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" upload/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" upload/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Nagram Desktop $VERSION" \
              --notes-file "$NOTES" \
              $PRERELEASE
          fi
